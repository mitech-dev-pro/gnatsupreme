name: CI

on:
  push:
    branches: [main, release/test, release/live]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      # Format-valid placeholders only -- the test suite stubs every Prisma call directly
      # (see backend/src/test/fixtures.ts) and never opens a real database connection, so
      # these only need to satisfy backend/src/config/env.ts's Zod validation at startup.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-only-placeholder-secret-00000000000000000000000000000000
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run format:check
      - working-directory: backend
        run: npm run lint
      - working-directory: backend
        run: npm run typecheck
      - working-directory: backend
        run: npm test
      - working-directory: backend
        run: npm run build

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
